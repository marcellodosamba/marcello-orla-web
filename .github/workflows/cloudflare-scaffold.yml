name: Cloudflare Scaffold

on:
  push:
    branches:
      - cloudflare/vinext-preview-20261018
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://gpbkbszchibjtdmkliah.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-publishable-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate Cloudflare vinext configuration
        run: npx --yes vinext@1.2.1 init --platform=cloudflare --name=marcello-orla-web --cdn-cache=none --data-cache=none --image-optimization=none --skip-check
      - name: Build with vinext
        run: npm run build:vinext
      - run: git diff --check
      - name: Commit generated Cloudflare configuration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json vite.config.ts cloudflare.config.ts .gitignore
          git commit -m "chore: add Cloudflare vinext configuration"
          git push origin HEAD:cloudflare/vinext-preview-20261018
