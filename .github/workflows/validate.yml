name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://gpbkbszchibjtdmkliah.supabase.co
      SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Check vinext compatibility
        run: npx --yes vinext@1.2.1 check
      - name: Build Cloudflare Workers target
        run: npm run build:vinext
