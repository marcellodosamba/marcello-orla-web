name: CI — Marcello Orla

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (lint + test + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://gpbkbszchibjtdmkliah.supabase.co
      SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
      - name: Check vinext compatibility
        run: npx --yes vinext@1.2.1 check
      - name: Build Cloudflare Workers target (dry-run)
        run: npm run build:vinext
      - name: Validate Cloudflare deployment package (dry-run)
        shell: bash
        run: |
          umask 077
          printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' 'dry-run-publishable-key' > "$RUNNER_TEMP/cloudflare-secrets.env"
          npx cf deploy --dry-run --prebuilt --secrets-file "$RUNNER_TEMP/cloudflare-secrets.env"

  build-prebuilt:
    name: Build Cloudflare Prebuilt Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    env:
      SUPABASE_URL: https://gpbkbszchibjtdmkliah.supabase.co
      SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:vinext
      - name: Package prebuilt output
        shell: bash
        run: |
          tar -czf cloudflare-prebuilt.tgz \
            .vinext .cloudflare dist \
            cloudflare.config.ts vite.config.ts package.json package-lock.json 2>/dev/null || \
          tar -czf cloudflare-prebuilt.tgz \
            .vinext .cloudflare \
            cloudflare.config.ts vite.config.ts package.json package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: marcello-orla-cloudflare-prebuilt
          path: cloudflare-prebuilt.tgz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate, build-prebuilt]
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    concurrency:
      group: marcello-orla-web-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      CF_QUIET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run typecheck
      - name: Verify deployment credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN ausente"; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "SUPABASE_PUBLISHABLE_KEY ausente"; exit 1; }
      - name: Prepare Worker secret file
        shell: bash
        run: |
          umask 077
          printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY" > "$RUNNER_TEMP/cloudflare-secrets.env"
      - name: Download prebuilt artifact
        uses: actions/download-artifact@v4
        with:
          name: marcello-orla-cloudflare-prebuilt
          path: prebuilt
      - name: Extract and deploy
        shell: bash
        run: |
          cd prebuilt
          tar -xzf marcello-orla-cloudflare-prebuilt.tgz
          npx cf deploy --secrets-file "$RUNNER_TEMP/cloudflare-secrets.env" --message "Marcello Orla deploy from CI: ${GITHUB_SHA::8}"