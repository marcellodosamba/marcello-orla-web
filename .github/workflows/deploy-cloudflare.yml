name: Deploy Cloudflare

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite DEPLOY para publicar o Worker marcello-orla-web'
        required: true
        type: string

permissions:
  contents: read

# Serialize production deployments: never cancel a running publication.
concurrency:
  group: marcello-orla-web-production
  cancel-in-progress: false

jobs:
  deploy:
    # Deliberately fail closed for other branches, repositories, and actors.
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'marcellodosamba/marcello-orla-web' && github.actor == 'marcellodosamba' && inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      CF_QUIET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Verify deployment credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN ausente"; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "SUPABASE_PUBLISHABLE_KEY ausente"; exit 1; }
      - name: Prepare Worker secret file
        shell: bash
        run: |
          umask 077
          printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY" > "$RUNNER_TEMP/cloudflare-secrets.env"
      - name: Deploy marcello-orla-web
        run: npx cf deploy --secrets-file "$RUNNER_TEMP/cloudflare-secrets.env" --message "Marcello Orla manual deploy from GitHub Actions"
